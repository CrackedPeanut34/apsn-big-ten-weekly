<nav class="week-switcher" aria-label="Week and rankings switcher">
  <ul>
    {% for w_season, w_week, w_season_type in all_weeks %}
    <li>
      <a href="{{ asset_prefix }}{{ w_season }}/{{ week_filename(w_week, w_season_type) }}"
         {% if (w_season, w_week, w_season_type) == current_week and not is_rankings %}aria-current="page" class="active"{% endif %}>
        {% if w_season_type == 'regular' %}Week {{ w_week }}{% else %}Postseason {{ w_week }}{% endif %}
      </a>
    </li>
    {% endfor %}
    <li>
      <a href="{{ asset_prefix }}{{ current_week[0] }}/{{ rankings_filename(current_week[1], current_week[2]) }}"
         {% if is_rankings %}aria-current="page" class="active"{% endif %}>
        Rankings
      </a>
    </li>
    <li>
      <a href="{{ asset_prefix }}{{ current_week[0] }}/{{ chart_page_filename(current_week[1], current_week[2]) }}"
         {% if is_chart %}aria-current="page" class="active"{% endif %}>
        Chart
      </a>
    </li>
  </ul>
</nav>
