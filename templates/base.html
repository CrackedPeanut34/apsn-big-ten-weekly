<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}APSN Big Ten Weekly{% endblock %}</title>
<meta name="description" content="Every Big Ten matchup this week: every prediction model's number and every sportsbook line, side by side.">
<link rel="stylesheet" href="{{ asset_prefix }}assets/css/site.css">
<link rel="icon" href="{{ asset_prefix }}assets/favicon.png">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ asset_prefix }}index.html">
      <img class="brand-logo" src="{{ asset_prefix }}assets/apsn-logo.png" alt="APSN">
      <span class="brand-title">Big Ten Weekly</span>
    </a>
    {% block week_switcher %}{% endblock %}
  </div>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <p>
    Odds and ratings data from
    <a href="https://collegefootballdata.com" rel="noopener">CollegeFootballData.com</a>.
    Not a betting product &mdash; no picks, no units, no advice.
  </p>
  <p>
    <a href="#feedback-heading">Reader feedback and corrections</a>
  </p>
</footer>
<script src="{{ asset_prefix }}assets/js/site.js" defer></script>
</body>
</html>
