name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run tests
        # CFBD_API_KEY only exists as a secret on the base repo, never on
        # forked-PR runs -- test_spread_sign_convention.py self-skips
        # without it rather than failing.
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: pytest tests/ -v
